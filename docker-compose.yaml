services:
  api:
    build: .
    container_name: address_book_api
    ports:
      - "8081:8002"
    environment:
      REDIS_HOST: db_redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on:
      - db_redis
    networks:
      - app_network

  db_redis:
    container_name: "address_book_redis"
    image: redis:7.4
    ports:
      - "6385:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD}
    networks:
      - app_network
    restart: always
    volumes:
      - redis_data:/data

volumes:
  redis_data:

networks:
  app_network:
    driver: bridge
