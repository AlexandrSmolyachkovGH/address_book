services:
  db_redis:
    container_name: "address_book_redis"
    image: redis:7.4
    environment:
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "6385:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD}
    networks:
      - app_network
    restart: always
    volumes:
      - redis_data:/data

volumes:
  redis_data:

networks:
  app_network:

